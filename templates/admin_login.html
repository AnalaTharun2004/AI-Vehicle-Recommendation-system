<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav><div class="navbar"><h1>Vehicle Recommendation System</h1><ul><li><a href="{{ url_for('index') }}">Home</a></li><li><a href="{{ url_for('login') }}">User Login</a></li></ul></div></nav>
    <main><section class="auth-page"><div class="auth-container">
        <h2>Administrator Login</h2>
        <p>Manage the vehicle catalog from the administrator dashboard.</p>
        {% with messages = get_flashed_messages() %}{% if messages %}<div class="messages">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}
        <form method="POST">
            <label for="email">Admin Email</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
    </div></section></main>
</body>
</html>
